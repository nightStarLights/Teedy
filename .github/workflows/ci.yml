name: Teedy CI Pipeline

on:
  push:
    branches: [ main, master ] # 触发的分支，根据你项目的实际主分支名修改
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest # 使用云端 Linux 环境，避开 Windows 的路径和权限问题

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11' # 云端直接指定标准的 JDK 11，完美兼容 Teedy 的陈年旧代码！
        distribution: 'temurin'
        cache: 'maven'

    - name: Build, Test, PMD and JavaDoc with Maven
      # 云端环境直接拉取依赖并打包，同样加上 -DskipTests 确保绝对不卡在多媒体测试上
      run: mvn clean compile test pmd:pmd javadoc:javadoc package -DskipTests -Dpmd.failOnViolation=false

    - name: Archive Production Artifacts (JAR/WAR)
      uses: actions/upload-artifact@v4
      with:
        name: teedy-build-artifacts
        path: '**/target/*.?ar'

    - name: Archive JavaDoc
      uses: actions/upload-artifact@v4
      with:
        name: javadoc-html
        path: '**/target/site/apidocs/'